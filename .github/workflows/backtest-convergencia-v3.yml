name: Backtest Motor Convergencia Espacial V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest-v3:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar backtest V3
        run: python collector/backtest_convergencia_v3.py

      - name: Salvar resultados
        uses: actions/upload-artifact@v4
        with:
          name: backtest-convergencia-v3
          path: |
            artifacts/backtest_v3_alertas.csv
            artifacts/backtest_v3_eventos_barcelos.csv
            artifacts/backtest_v3_metricas.csv
            artifacts/backtest_v3_resumo.json
          retention-days: 14
