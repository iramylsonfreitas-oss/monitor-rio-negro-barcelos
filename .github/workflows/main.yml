name: Testar Barcelos API v2

on:
  workflow_dispatch:

jobs:
  barcelos:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar dados reais de Barcelos
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo "1. AUTENTICANDO NA ANA"
          echo "=========================================="

          curl -sS \
            -H "Identificador: $ANA_IDENTIFIER" \
            -H "Senha: $ANA_PASSWORD" \
            "https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/OAUth/v1" \
            -o auth.json

          TOKEN=$(python - <<'PY'
          import json

          with open("auth.json", encoding="utf-8") as f:
              data = json.load(f)

          token = (data.get("items") or {}).get("tokenautenticacao")

          if not token:
              raise SystemExit("ERRO: token não encontrado.")

          print(token)
          PY
          )

          echo "Autenticação OK."
          echo

          URL="https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/HidroinfoanaSerieTelemetricaAdotada/v2"

          echo "=========================================="
          echo "2. CONSULTANDO BARCELOS"
          echo "=========================================="

          HTTP=$(curl -sS \
            --get \
            -o barcelos.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json" \
            --data-urlencode "Codigos_Estacoes=14480002" \
            --data-urlencode "Tipo Filtro Data=DATA_LEITURA" \
            --data-urlencode "Range Intervalo de busca=HORA_24" \
            "$URL")

          echo "HTTP: $HTTP"

          if [ "$HTTP" != "200" ]; then

            echo
            echo "Bearer não retornou 200."
            echo "Testando token direto no header Authorization..."

            HTTP=$(curl -sS \
              --get \
              -o barcelos.json \
              -w "%{http_code}" \
              -H "Authorization: $TOKEN" \
              -H "Accept: application/json" \
              --data-urlencode "Codigos_Estacoes=14480002" \
              --data-urlencode "Tipo Filtro Data=DATA_LEITURA" \
              --data-urlencode "Range Intervalo de busca=HORA_24" \
              "$URL")

            echo "HTTP token direto: $HTTP"

          fi

          echo
          echo "=========================================="
          echo "3. ANALISANDO RESPOSTA"
          echo "=========================================="

          python - <<'PY'
          import json
          import sys

          with open("barcelos.json", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):

              print("Campos principais:", list(data.keys()))

              if data.get("status") and data.get("status") != 200:
                  print("Status:", data.get("status"))
                  print("Erro:", data.get("error"))
                  print("Mensagem:", data.get("message"))
                  sys.exit(1)

              items = data.get("items")

          else:
              items = data

          print("Tipo de items:", type(items).__name__)

          registros = []

          def procurar(obj):

              if isinstance(obj, dict):

                  campos = {str(k).lower(): v for k, v in obj.items()}

                  if any(
                      termo in chave
                      for chave in campos
                      for termo in ["cota", "nivel", "nível", "data_hora", "datahora"]
                  ):
                      registros.append(obj)

                  for v in obj.values():
                      procurar(v)

              elif isinstance(obj, list):

                  for v in obj:
                      procurar(v)

          procurar(items)

          print("Registros candidatos encontrados:", len(registros))

          print()
          print("==========================================")
          print("AMOSTRA DOS DADOS RECEBIDOS")
          print("==========================================")

          if registros:

              for i, r in enumerate(registros[:5], start=1):
                  print()
                  print("REGISTRO", i)

                  for k, v in r.items():
                      print(f"{k}: {v}")

          else:

              print(json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              )[:8000])

          print()
          print("==========================================")
          print("FIM DA CONSULTA")
          print("==========================================")
          PY
