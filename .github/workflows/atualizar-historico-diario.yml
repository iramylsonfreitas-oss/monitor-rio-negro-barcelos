name: Atualizar Historico Diario

on:
  workflow_dispatch:

  schedule:
    # 10:17 UTC = 06:17 em Manaus
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-rio-negro
  cancel-in-progress: false

jobs:
  atualizar-historico:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Atualizar dados ANA e historico
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
        run: |
          python collector/ana_resiliente.py


      - name: Recalcular eventos V2
        run: |
          python collector/eventos_v2.py


      - name: Recalcular correlacoes historicas
        run: |
          python collector/propagacao.py


      - name: Gerar comparativo anual de Barcelos
        run: |
          python collector/comparativo_anual.py


      - name: Executar backtest do detector de repiquete
        run: |
          python collector/repiquete_historico.py


      - name: Conferir historico
        run: |
          echo "======================================"
          echo "ATUALIZAÇÃO HISTÓRICA DIÁRIA"
          echo "======================================"

          if [ ! -f data/history/hourly.csv ]; then
            echo "ERRO:"
            echo "data/history/hourly.csv não encontrado."
            exit 1
          fi

          echo
          echo "Total de linhas:"
          wc -l data/history/hourly.csv

          echo
          echo "Tamanho:"
          ls -lh data/history/hourly.csv

          echo
          echo "Últimas 10 linhas:"
          tail -n 10 data/history/hourly.csv


      - name: Conferir comparativo anual
        run: |
          echo "======================================"
          echo "COMPARATIVO ANUAL DE BARCELOS"
          echo "======================================"

          if [ ! -f data/barcelos_anual.json ]; then
            echo "ERRO:"
            echo "data/barcelos_anual.json não foi criado."
            exit 1
          fi

          python - <<'PY'
          import json

          with open(
              "data/barcelos_anual.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Estação:",
              data.get("estacao")
          )

          print(
              "Anos disponíveis:",
              ", ".join(
                  data.get(
                      "anos",
                      []
                  )
              )
          )

          resumo = (
              data.get(
                  "resumo"
              )
              or {}
          )

          for ano, info in (
              resumo.items()
          ):

              print()
              print(
                  ano
              )

              print(
                  "Dias disponíveis:",
                  info.get(
                      "dias_disponiveis"
                  )
              )

              print(
                  "Período:",
                  info.get(
                      "primeira_data"
                  ),
                  "até",
                  info.get(
                      "ultima_data"
                  )
              )

              print(
                  "Mínimo:",
                  info.get(
                      "nivel_min_m"
                  ),
                  "m"
              )

              print(
                  "Máximo:",
                  info.get(
                      "nivel_max_m"
                  ),
                  "m"
              )
          PY


      - name: Conferir eventos V2
        run: |
          echo "======================================"
          echo "EVENTOS V2"
          echo "======================================"

          python - <<'PY'
          import json

          with open(
              "data/eventos_propagacao_v2.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          for pair in data.get(
              "pares",
              []
          ):

              print()
              print(
                  pair.get(
                      "nome_origem"
                  ),
                  "→ Barcelos"
              )

              print(
                  "Eventos origem:",
                  pair.get(
                      "eventos_montante"
                  )
              )

              print(
                  "Correspondentes:",
                  pair.get(
                      "eventos_correspondentes"
                  )
              )

              print(
                  "Taxa:",
                  pair.get(
                      "taxa_correspondencia"
                  )
              )

              print(
                  "Mediana:",
                  pair.get(
                      "mediana_dias"
                  ),
                  "dias"
              )

              print(
                  "Faixa central:",
                  pair.get(
                      "q25_dias"
                  ),
                  "a",
                  pair.get(
                      "q75_dias"
                  ),
                  "dias"
              )
          PY


      - name: Conferir backtest do repiquete
        run: |
          echo "======================================"
          echo "BACKTEST DO REPIQUETE"
          echo "======================================"

          if [ ! -f data/repiquete_backtest.json ]; then
            echo "ERRO:"
            echo "data/repiquete_backtest.json não foi criado."
            exit 1
          fi

          python - <<'PY'
          import json

          with open(
              "data/repiquete_backtest.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          resumo = (
              data.get("resumo")
              or {}
          )

          print(
              "Período:",
              resumo.get(
                  "periodo_inicio_manaus"
              ),
              "até",
              resumo.get(
                  "periodo_fim_manaus"
              )
          )

          print(
              "Checkpoints analisados:",
              resumo.get(
                  "checkpoints_analisados"
              )
          )

          print(
              "Ocorrências do primeiro limiar:",
              resumo.get(
                  "ocorrencias_primeiro_limiar"
              )
          )

          print(
              "Eventos confirmados:",
              resumo.get(
                  "eventos_confirmados"
              )
          )

          print(
              "Eventos encerrados:",
              resumo.get(
                  "eventos_encerrados"
              )
          )

          print(
              "Eventos ativos no fim:",
              resumo.get(
                  "eventos_ativos_no_fim"
              )
          )

          print(
              "Eventos por ano:",
              resumo.get(
                  "eventos_por_ano"
              )
          )

          print(
              "Atraso da confirmação:",
              resumo.get(
                  "atraso_confirmacao_h"
              ),
              "h"
          )

          print(
              "Ganho mediano 24 h:",
              resumo.get(
                  "ganho_mediano_24h_apos_confirmacao_cm"
              ),
              "cm"
          )

          print(
              "Ganho mediano 48 h:",
              resumo.get(
                  "ganho_mediano_48h_apos_confirmacao_cm"
              ),
              "cm"
          )

          print(
              "Ganho mediano 72 h:",
              resumo.get(
                  "ganho_mediano_72h_apos_confirmacao_cm"
              ),
              "cm"
          )

          print()
          print("EVENTOS:")

          for event in data.get(
              "eventos",
              []
          ):

              print()
              print(
                  "Evento",
                  event.get(
                      "evento"
                  )
              )

              print(
                  "Sinal:",
                  event.get(
                      "inicio_sinal_manaus"
                  )
              )

              print(
                  "Confirmado:",
                  event.get(
                      "confirmado_em_manaus"
                  )
              )

              print(
                  "Pico:",
                  event.get(
                      "nivel_pico_m"
                  ),
                  "m em",
                  event.get(
                      "pico_em_manaus"
                  )
              )

              print(
                  "Ganho máximo após confirmação:",
                  event.get(
                      "ganho_maximo_desde_confirmacao_cm"
                  ),
                  "cm"
              )
          PY


      - name: Mostrar situacao atual
        run: |
          echo "======================================"
          echo "SITUAÇÃO ATUAL"
          echo "======================================"

          python - <<'PY'
          import json

          with open(
              "data/estacoes.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          for station in data.get(
              "estacoes",
              []
          ):

              print()
              print(
                  station["nome"]
              )

              print(
                  "Nível:",
                  station["nivel_m"],
                  "m"
              )

              print(
                  "6 h:",
                  station[
                      "variacao_6h_cm"
                  ],
                  "cm"
              )

              print(
                  "24 h:",
                  station[
                      "variacao_24h_cm"
                  ],
                  "cm"
              )

              print(
                  "72 h:",
                  station[
                      "variacao_72h_cm"
                  ],
                  "cm"
              )

              print(
                  "7 dias:",
                  station[
                      "variacao_7d_cm"
                  ],
                  "cm"
              )

              print(
                  "Tendência:",
                  station[
                      "tendencia"
                  ]
              )
          PY


      - name: Salvar atualizacao diaria
        run: |
          git config user.name "rio-negro-bot"
          git config user.email "actions@github.com"

          git add data/history/hourly.csv

          git add data/latest.json
          git add data/series_30d.json
          git add data/estacoes.json

          git add data/eventos_propagacao_v2.json
          git add data/propagacao.json
          git add data/barcelos_anual.json
          git add data/repiquete_backtest.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Atualiza historico diario ANA"

          git pull --rebase origin main

          git push origin main
