name: Diagnostico Swagger ANA

on:
  workflow_dispatch:

jobs:
  swagger:
    runs-on: ubuntu-latest

    steps:
      - name: Ler especificacao oficial da API ANA
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.parse

          BASE = "https://www.ana.gov.br/hidrowebservice"

          def baixar(url):
              print()
              print("Consultando:", url)

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      conteudo = r.read().decode("utf-8", errors="replace")
                      print("HTTP:", r.status)
                      return conteudo
              except Exception as e:
                  print("ERRO:", e)
                  return None

          documentos = []

          # Tenta descobrir os grupos publicados pelo Swagger
          recursos = baixar(BASE + "/swagger-resources")

          if recursos:
              try:
                  dados = json.loads(recursos)

                  print()
                  print("GRUPOS SWAGGER ENCONTRADOS:")

                  for item in dados:
                      nome = item.get("name")
                      local = item.get("location")

                      print("-", nome, "=>", local)

                      if local:
                          if local.startswith("http"):
                              url = local
                          else:
                              url = urllib.parse.urljoin(BASE + "/", local.lstrip("/"))

                          documentos.append(url)

              except Exception as e:
                  print("Não foi possível interpretar swagger-resources:", e)

          # Endpoints comuns do Swagger
          documentos.extend([
              BASE + "/v2/api-docs",
              BASE + "/v3/api-docs"
          ])

          vistos = set()
          encontrou = False

          for url in documentos:

              if url in vistos:
                  continue

              vistos.add(url)

              texto = baixar(url)

              if not texto:
                  continue

              try:
                  spec = json.loads(texto)
              except:
                  continue

              paths = spec.get("paths", {})

              print()
              print("Documento contém", len(paths), "rotas.")

              for caminho, metodos in paths.items():

                  termo = caminho.lower()

                  if (
                      "hidroinfoanaserietelemetricaadotada" in termo
                      or "serietelemetrica" in termo
                      or "hidroinfoana" in termo
                  ):
                      encontrou = True

                      print()
                      print("==========================================")
                      print("ROTA ENCONTRADA")
                      print("==========================================")
                      print("PATH:", caminho)

                      for metodo, info in metodos.items():

                          if metodo.lower() not in [
                              "get", "post", "put", "delete", "patch"
                          ]:
                              continue

                          print("MÉTODO:", metodo.upper())

                          parametros = info.get("parameters", [])

                          print("PARÂMETROS:")

                          if not parametros:
                              print("Nenhum parâmetro listado.")

                          for p in parametros:
                              schema = p.get("schema", {})

                              print(
                                  "- nome:", p.get("name"),
                                  "| local:", p.get("in"),
                                  "| obrigatório:", p.get("required"),
                                  "| tipo:", p.get("type") or schema.get("type"),
                                  "| enum:", p.get("enum") or schema.get("enum")
                              )

                          print("SEGURANÇA:", info.get("security"))

          print()
          print("==========================================")

          if encontrou:
              print("SUCESSO: rota telemétrica localizada no Swagger.")
          else:
              print("ATENÇÃO: a rota telemétrica não apareceu nos documentos consultados.")

          print("==========================================")
          PY
