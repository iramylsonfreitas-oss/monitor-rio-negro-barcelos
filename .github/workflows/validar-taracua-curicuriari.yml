name: Validar Taracua Curicuriari Multiescala

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-taracua-curicuriari:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar Taracua para Curicuriari
        run: |
          python collector/validar_taracua_curicuriari.py

      - name: Salvar resultados
        uses: actions/upload-artifact@v4
        with:
          name: taracua-curicuriari-validacao
          path: |
            artifacts/taracua_curicuriari_robustos.csv
            artifacts/taracua_curicuriari_rejeitados.csv
            artifacts/taracua_curicuriari_escalas.csv
            artifacts/resumo_taracua_curicuriari.json
          retention-days: 14
