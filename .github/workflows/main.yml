name: Localizar Telemetria ANA

on:
  workflow_dispatch:

jobs:
  localizar:
    runs-on: ubuntu-latest

    steps:
      - name: Procurar rota telemetrica oficial
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.parse

          HOST = "https://www.ana.gov.br"

          documentos = [
              "/hidrowebservice/api-docs",
              "/hidrowebservice/api-docs/Versão - v1.0.3984.2",
              "/hidrowebservice/api-docs/Versão - v2.0.6581.0"
          ]

          def montar_url(caminho):
              return HOST + urllib.parse.quote(
                  caminho,
                  safe="/:-._"
              )

          def baixar(url):
              print()
              print("CONSULTANDO:")
              print(url)

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      texto = r.read().decode("utf-8", errors="replace")
                      print("HTTP:", r.status)
                      return json.loads(texto)
              except Exception as e:
                  print("ERRO:", e)
                  return None

          encontrou = False

          for caminho_doc in documentos:

              spec = baixar(montar_url(caminho_doc))

              if not spec:
                  continue

              print("OpenAPI:", spec.get("openapi") or spec.get("swagger"))
              print("Quantidade de rotas:", len(spec.get("paths", {})))

              for path, metodos in spec.get("paths", {}).items():

                  p = path.lower()

                  if (
                      "hidroinfoanaserietelemetricaadotada" in p
                      or "telemetricaadotada" in p
                      or "serietelemetrica" in p
                  ):

                      encontrou = True

                      print()
                      print("============================================")
                      print("ROTA ENCONTRADA")
                      print("============================================")
                      print("DOCUMENTO:", caminho_doc)
                      print("PATH:", path)

                      for metodo, info in metodos.items():

                          if metodo.lower() not in [
                              "get", "post", "put", "delete", "patch"
                          ]:
                              continue

                          print()
                          print("MÉTODO:", metodo.upper())
                          print("SUMMARY:", info.get("summary"))

                          print()
                          print("PARÂMETROS:")

                          parametros = info.get("parameters", [])

                          if not parametros:
                              print("Nenhum parâmetro.")

                          for p in parametros:

                              schema = p.get("schema", {})

                              print()
                              print("NOME EXATO:", p.get("name"))
                              print("LOCAL:", p.get("in"))
                              print("OBRIGATÓRIO:", p.get("required"))
                              print("TIPO:", schema.get("type"))
                              print("FORMATO:", schema.get("format"))
                              print("ENUM:", schema.get("enum"))
                              print("EXEMPLO:", p.get("example") or schema.get("example"))
                              print("DESCRIÇÃO:", p.get("description"))

                          if info.get("requestBody"):
                              print()
                              print("REQUEST BODY:")
                              print(json.dumps(
                                  info["requestBody"],
                                  indent=2,
                                  ensure_ascii=False
                              ))

                          print()
                          print("SEGURANÇA:")
                          print(
                              json.dumps(
                                  info.get("security"),
                                  ensure_ascii=False
                              )
                          )

          print()
          print("============================================")

          if encontrou:
              print("SUCESSO: rota telemétrica localizada.")
          else:
              print("ATENÇÃO: rota telemétrica não encontrada nos três documentos.")

          print("============================================")
          PY
