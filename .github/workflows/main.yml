name: Resolver Swagger ANA

on:
  workflow_dispatch:

jobs:
  resolver:
    runs-on: ubuntu-latest

    steps:
      - name: Resolver caminhos reais do Swagger
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import re

          PAGE = "https://www.ana.gov.br/hidrowebservice/swagger-ui.html"

          def baixar(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      conteudo = r.read().decode("utf-8", errors="replace")
                      return r.status, conteudo, r.geturl()
              except Exception as e:
                  return None, str(e), None

          print("========================================")
          print("1. PAGINA SWAGGER")
          print("========================================")

          status, html, final_url = baixar(PAGE)

          print("HTTP:", status)
          print("URL final:", final_url)
          print()

          if status != 200:
              print("ERRO ao abrir página Swagger.")
              raise SystemExit(1)

          print("========================================")
          print("2. HTML COMPLETO")
          print("========================================")
          print(html)
          print()

          base_match = re.search(
              r'<base[^>]+href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          base_href = base_match.group(1) if base_match else None

          print("========================================")
          print("3. BASE HREF")
          print("========================================")
          print(base_href if base_href else "Nenhum <base href> encontrado.")
          print()

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              flags=re.I
