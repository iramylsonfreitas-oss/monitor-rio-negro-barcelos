name: Inspecionar Swagger ANA

on:
  workflow_dispatch:

jobs:
  inspecionar:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar HTML e testar arquivos Swagger
        run: |
          echo "======================================"
          echo "1. PAGINA OFICIAL"
          echo "======================================"

          curl -L -sS \
            -w "\nHTTP_FINAL: %{http_code}\nURL_FINAL: %{url_effective}\n" \
            "https://www.ana.gov.br/hidrowebservice/swagger-ui.html" \
            -o pagina.html

          cat pagina.html

          echo
          echo "======================================"
          echo "2. TESTE swagger-initializer.js"
          echo "======================================"

          curl -L -sS \
            -w "\nHTTP_FINAL: %{http_code}\nURL_FINAL: %{url_effective}\n" \
            "https://www.ana.gov.br/hidrowebservice/swagger-initializer.js" \
            -o initializer1.js

          cat initializer1.js

          echo
          echo "======================================"
          echo "3. TESTE /swagger-ui/swagger-initializer.js"
          echo "======================================"

          curl -L -sS \
            -w "\nHTTP_FINAL: %{http_code}\nURL_FINAL: %{url_effective}\n" \
            "https://www.ana.gov.br/hidrowebservice/swagger-ui/swagger-initializer.js" \
            -o initializer2.js

          cat initializer2.js

          echo
          echo "======================================"
          echo "4. TESTE index.html"
          echo "======================================"

          curl -L -sS \
            -w "\nHTTP_FINAL: %{http_code}\nURL_FINAL: %{url_effective}\n" \
            "https://www.ana.gov.br/hidrowebservice/swagger-ui/index.html" \
            -o index.html

          cat index.html

          echo
          echo "======================================"
          echo "FIM"
          echo "======================================"
