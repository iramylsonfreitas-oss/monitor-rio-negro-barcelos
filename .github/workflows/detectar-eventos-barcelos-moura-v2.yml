name: Detectar Eventos Barcelos Moura V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detectar-eventos-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detectar e parear eventos V2
        run: |
          python collector/detectar_eventos_barcelos_moura_v2.py

      - name: Salvar resultados
        uses: actions/upload-artifact@v4
        with:
          name: eventos-barcelos-moura-v2
          path: |
            artifacts/eventos_barcelos_moura_v2.csv
            artifacts/candidatos_barcelos_moura_v2.csv
            artifacts/resumo_eventos_barcelos_moura_v2.json
          retention-days: 14
