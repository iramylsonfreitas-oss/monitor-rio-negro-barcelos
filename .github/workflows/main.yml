name: Ler Swagger Initializer ANA

on:
  workflow_dispatch:

jobs:
  initializer:
    runs-on: ubuntu-latest

    steps:
      - name: Ler configuracao Swagger ANA
        run: |
          set -e

          URL="https://www.ana.gov.br/hidrowebservice/swagger-initializer.js"

          echo "======================================"
          echo "CONSULTANDO SWAGGER INITIALIZER"
          echo "======================================"
          echo "$URL"
          echo

          HTTP=$(curl -sS \
            -o initializer.js \
            -w "%{http_code}" \
            "$URL")

          echo "HTTP: $HTTP"
          echo

          if [ "$HTTP" != "200" ]; then
            echo "ERRO: não foi possível baixar swagger-initializer.js"
            exit 1
          fi

          echo "======================================"
          echo "CONTEUDO DO ARQUIVO"
          echo "======================================"

          cat initializer.js

          echo
          echo
          echo "======================================"
          echo "URLs IDENTIFICADAS"
          echo "======================================"

          grep -Eo 'https?://[^"'"'"' ]+|url:[[:space:]]*"[^"]+"|url:[[:space:]]*'"'"'[^'"'"']+'"'"'' initializer.js || true

          echo
          echo "======================================"
          echo "FIM"
          echo "======================================"
