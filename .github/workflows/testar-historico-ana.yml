name: Testar Historico ANA

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:

      - name: Testar consulta historica
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}

        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error
          import time
          from datetime import datetime


          IDENTIFICADOR = os.environ[
              "ANA_IDENTIFIER"
          ]

          SENHA = os.environ[
              "ANA_PASSWORD"
          ]


          AUTH_URL = (
              "https://www.ana.gov.br/"
              "hidrowebservice/"
              "EstacoesTelemetricas/"
              "OAUth/v1"
          )


          DATA_URL = (
              "https://www.ana.gov.br/"
              "hidrowebservice/"
              "EstacoesTelemetricas/"
              "HidroinfoanaSerieTelemetricaAdotada/v2"
          )


          ESTACOES = (
              "14110000,"
              "14280001,"
              "14330000,"
              "14420000,"
              "14480002"
          )


          def request_json(
              url,
              headers,
              attempts=3
          ):

              for tentativa in range(
                  1,
                  attempts + 1
              ):

                  try:

                      req = (
                          urllib.request.Request(
                              url,
                              headers=headers
                          )
                      )

                      with (
                          urllib.request.urlopen(
                              req,
                              timeout=180
                          )
                      ) as response:

                          return json.loads(
                              response
                              .read()
                              .decode(
                                  "utf-8",
                                  errors="replace"
                              )
                          )

                  except Exception as erro:

                      print(
                          "Tentativa",
                          tentativa,
                          "falhou:",
                          erro
                      )

                      if (
                          tentativa
                          == attempts
                      ):
                          raise

                      time.sleep(
                          10 * tentativa
                      )


          print(
              "===================================="
          )

          print(
              "1. AUTENTICAÇÃO"
          )

          print(
              "===================================="
          )


          auth = request_json(
              AUTH_URL,
              {
                  "Identificador":
                      IDENTIFICADOR,

                  "Senha":
                      SENHA,

                  "Accept":
                      "application/json"
              }
          )


          token = (
              auth.get("items") or {}
          ).get(
              "tokenautenticacao"
          )


          if not token:

              raise RuntimeError(
                  "Token não encontrado."
              )


          print(
              "Autenticação OK."
          )


          print()
          print(
              "===================================="
          )

          print(
              "2. CONSULTA HISTÓRICA"
          )

          print(
              "===================================="
          )


          parametros = {

              "Codigos_Estacoes":
                  ESTACOES,

              "Tipo Filtro Data":
                  "DATA_LEITURA",

              "Data de Busca (yyyy-MM-dd)":
                  "2026-07-15",

              "Range Intervalo de busca":
                  "DIAS_30"
          }


          url = (
              DATA_URL
              + "?"
              + urllib.parse.urlencode(
                  parametros
              )
          )


          print(
              "Data solicitada:",
              "15/07/2026"
          )

          print()


          resposta = request_json(
              url,
              {
                  "Authorization":
                      "Bearer " + token,

                  "Accept":
                      "application/json",

                  "User-Agent":
                      "Monitor-Rio-Negro/1.0"
              }
          )


          items = (
              resposta.get("items")
              or []
          )


          print(
              "Mensagem ANA:",
              resposta.get("message")
          )

          print(
              "Registros recebidos:",
              len(items)
          )


          if not items:

              raise RuntimeError(
                  "Nenhum registro histórico "
                  "foi retornado."
              )


          print()
          print(
              "===================================="
          )

          print(
              "3. PERÍODO REAL RETORNADO"
          )

          print(
              "===================================="
          )


          datas = []

          por_estacao = {}


          for row in items:

              data = row.get(
                  "Data_Hora_Medicao"
              )

              codigo = str(
                  row.get(
                      "codigoestacao"
                  )
              )


              if not data:
                  continue


              dt = datetime.fromisoformat(
                  data.replace(
                      " ",
                      "T"
                  )
              )


              datas.append(
                  dt
              )


              por_estacao.setdefault(
                  codigo,
                  []
              ).append(
                  dt
              )


          if datas:

              print(
                  "Primeira medição:",
                  min(datas)
              )

              print(
                  "Última medição:",
                  max(datas)
              )


          print()
          print(
              "===================================="
          )

          print(
              "4. ESTAÇÕES"
          )

          print(
              "===================================="
          )


          nomes = {
              "14110000": "Cucuí",
              "14280001": "Taracuá",
              "14330000": "Curicuriari",
              "14420000": "Serrinha",
              "14480002": "Barcelos"
          }


          for codigo, nome in (
              nomes.items()
          ):

              dados = (
                  por_estacao.get(
                      codigo,
                      []
                  )
              )


              print()
              print(
                  nome,
                  codigo
              )

              print(
                  "Registros:",
                  len(dados)
              )


              if dados:

                  print(
                      "Início:",
                      min(dados)
                  )

                  print(
                      "Fim:",
                      max(dados)
                  )


          print()
          print(
              "===================================="
          )

          print(
              "TESTE CONCLUÍDO"
          )

          print(
              "===================================="
          )
          PY
