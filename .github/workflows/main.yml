name: Teste ANA

on:
  workflow_dispatch:

jobs:
  testar-ana:
    runs-on: ubuntu-latest

    steps:
      - name: Testar autenticação na ANA
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
        run: |
          echo "Iniciando teste de autenticação na ANA..."

          HTTP_CODE=$(curl -s -o resposta.json -w "%{http_code}" \
            -H "Identificador: $ANA_IDENTIFIER" \
            -H "Senha: $ANA_PASSWORD" \
            "https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/OAUth/v1")

          echo "HTTP recebido: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERRO: a ANA não retornou HTTP 200."
            exit 1
          fi

          python - <<'PY'
          import json

          with open("resposta.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("items") or {}
          token = items.get("tokenautenticacao")

          if not token:
              print("ERRO: resposta recebida, mas tokenautenticacao não foi localizado.")
              print("Campos principais:", list(data.keys()))
              print("Campos de items:", list(items.keys()) if isinstance(items, dict) else "formato inesperado")
              raise SystemExit(1)

          print("SUCESSO: autenticação realizada.")
          print("Token recebido corretamente.")
          print("O token não será exibido por segurança.")
          PY
