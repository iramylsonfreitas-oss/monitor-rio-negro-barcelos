name: Diagnosticar Dados Barcelos

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar disponibilidade dos dados de Barcelos
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}

        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          IDENTIFICADOR = os.environ["ANA_IDENTIFIER"]
          SENHA = os.environ["ANA_PASSWORD"]

          # =========================
          # AUTENTICAÇÃO
          # =========================

          auth_url = (
              "https://www.ana.gov.br/hidrowebservice/"
              "EstacoesTelemetricas/OAUth/v1"
          )

          req = urllib.request.Request(
              auth_url,
              headers={
                  "Identificador": IDENTIFICADOR,
                  "Senha": SENHA,
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              auth = json.loads(r.read().decode("utf-8"))

          token = (auth.get("items") or {}).get("tokenautenticacao")

          if not token:
              raise SystemExit("ERRO: token não encontrado.")

          print("AUTENTICAÇÃO: OK")
          print()

          BASE = (
              "https://www.ana.gov.br/hidrowebservice/"
              "EstacoesTelemetricas/"
          )

          testes = [
              {
                  "nome": "ADOTADA V2 - 24 HORAS",
                  "endpoint": "HidroinfoanaSerieTelemetricaAdotada/v2",
                  "filtro": "DATA_LEITURA",
                  "range": "HORA_24"
              },
              {
                  "nome": "ADOTADA V2 - 2 DIAS",
                  "endpoint": "HidroinfoanaSerieTelemetricaAdotada/v2",
                  "filtro": "DATA_LEITURA",
                  "range": "DIAS_2"
              },
              {
                  "nome": "ADOTADA V2 - 7 DIAS",
                  "endpoint": "HidroinfoanaSerieTelemetricaAdotada/v2",
                  "filtro": "DATA_LEITURA",
                  "range": "DIAS_7"
              },
              {
                  "nome": "ADOTADA V2 - 30 DIAS",
                  "endpoint": "HidroinfoanaSerieTelemetricaAdotada/v2",
                  "filtro": "DATA_LEITURA",
                  "range": "DIAS_30"
              },
              {
                  "nome": "ADOTADA V2 - ATUALIZAÇÃO 30 DIAS",
                  "endpoint": "HidroinfoanaSerieTelemetricaAdotada/v2",
                  "filtro": "DATA_ULTIMA_ATUALIZACAO",
                  "range": "DIAS_30"
              },
              {
                  "nome": "DETALHADA V2 - 30 DIAS",
                  "endpoint": "HidroinfoanaSerieTelemetricaDetalhada/v2",
                  "filtro": "DATA_LEITURA",
                  "range": "DIAS_30"
              }
          ]

          resultados = []

          for teste in testes:

              parametros = {
                  "Codigos_Estacoes": "14480002",
                  "Tipo Filtro Data": teste["filtro"],
                  "Range Intervalo de busca": teste["range"]
              }

              url = (
                  BASE
                  + teste["endpoint"]
                  + "?"
                  + urllib.parse.urlencode(parametros)
              )

              print("==========================================")
              print(teste["nome"])
              print("==========================================")

              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json",
                      "User-Agent": "Monitor-Rio-Negro/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(req, timeout=40) as r:

                      resposta = json.loads(
                          r.read().decode(
                              "utf-8",
                              errors="replace"
                          )
                      )

                      items = resposta.get("items") or []

                      print("HTTP:", r.status)
                      print("CODE:", resposta.get("code"))
                      print("MESSAGE:", resposta.get("message"))
                      print("REGISTROS:", len(items))

                      if items:

                          print()
                          print("PRIMEIRO REGISTRO:")
                          print(
                              json.dumps(
                                  items[0],
                                  indent=2,
                                  ensure_ascii=False
                              )[:5000]
                          )

                          print()
                          print("ÚLTIMO REGISTRO:")
                          print(
                              json.dumps(
                                  items[-1],
                                  indent=2,
                                  ensure_ascii=False
                              )[:5000]
                          )

                      resultados.append(
                          (
                              teste["nome"],
                              r.status,
                              len(items),
                              resposta.get("message")
                          )
                      )

              except urllib.error.HTTPError as e:

                  texto = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("HTTP:", e.code)
                  print("ERRO:", texto[:2000])

                  resultados.append(
                      (
                          teste["nome"],
                          e.code,
                          0,
                          "ERRO HTTP"
                      )
                  )

              print()

          print()
          print("==========================================")
          print("RESUMO FINAL")
          print("==========================================")

          for nome, http, qtd, mensagem in resultados:

              print()
              print(nome)
              print("HTTP:", http)
              print("REGISTROS:", qtd)
              print("MENSAGEM:", mensagem)

          print()
          print("==========================================")
          print("DIAGNÓSTICO CONCLUÍDO")
          print("==========================================")
          PY
