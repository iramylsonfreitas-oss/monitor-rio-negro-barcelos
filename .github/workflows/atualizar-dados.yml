name: Atualizar dados do Rio Negro

on:
  workflow_dispatch:

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-rio-negro
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Consultar ANA
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
        run: |
          python collector/ana.py


      - name: Gerar alerta atual
        run: |
          python collector/alerta.py


      - name: Conferir dados atuais
        run: |
          echo "======================================"
          echo "MONITOR RIO NEGRO"
          echo "======================================"

          python - <<'PY'
          import json

          with open(
              "data/estacoes.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          for station in data.get(
              "estacoes",
              []
          ):

              print()
              print(
                  station["nome"],
                  station["estacao"]
              )

              print(
                  "Nível:",
                  station["nivel_m"],
                  "m"
              )

              print(
                  "6 h:",
                  station[
                      "variacao_6h_cm"
                  ],
                  "cm"
              )

              print(
                  "24 h:",
                  station[
                      "variacao_24h_cm"
                  ],
                  "cm"
              )

              print(
                  "72 h:",
                  station[
                      "variacao_72h_cm"
                  ],
                  "cm"
              )

              print(
                  "7 dias:",
                  station[
                      "variacao_7d_cm"
                  ],
                  "cm"
              )

              print(
                  "Tendência:",
                  station[
                      "tendencia"
                  ]
              )

              print(
                  "Medição:",
                  station.get(
                      "data_medicao_manaus"
                  )
              )
          PY


      - name: Conferir alerta
        run: |
          echo "======================================"
          echo "ALERTA ATUAL"
          echo "======================================"

          if [ ! -f data/alerta.json ]; then
            echo "ERRO:"
            echo "data/alerta.json não foi criado."
            exit 1
          fi

          python - <<'PY'
          import json

          with open(
              "data/alerta.json",
              encoding="utf-8"
          ) as f:
              alerta = json.load(f)

          print(
              "Status:",
              alerta.get(
                  "rotulo"
              )
          )

          print(
              "Nível:",
              alerta.get(
                  "nivel"
              )
          )

          print(
              "Título:",
              alerta.get(
                  "titulo"
              )
          )

          print()

          print(
              "Mensagem:"
          )

          print(
              alerta.get(
                  "mensagem"
              )
          )

          print()

          evento = (
              alerta.get(
                  "evento_serrinha"
              )
              or {}
          )

          print(
              "Evento confirmado em Serrinha:",
              evento.get(
                  "confirmado"
              )
          )

          print(
              "Início do evento:",
              evento.get(
                  "inicio_manaus"
              )
          )

          print()

          historico = (
              alerta.get(
                  "historico_serrinha_barcelos"
              )
              or {}
          )

          print(
              "Histórico Serrinha → Barcelos"
          )

          print(
              "Eventos em Serrinha:",
              historico.get(
                  "eventos_serrinha"
              )
          )

          print(
              "Correspondentes:",
              historico.get(
                  "eventos_correspondentes"
              )
          )

          print(
              "Mediana:",
              historico.get(
                  "mediana_dias"
              ),
              "dias"
          )

          print(
              "Faixa central:",
              historico.get(
                  "q25_dias"
              ),
              "a",
              historico.get(
                  "q75_dias"
              ),
              "dias"
          )

          print()

          janela = (
              alerta.get(
                  "janela_historica"
              )
              or {}
          )

          print(
              "Janela aplicável agora:",
              janela.get(
                  "aplicavel"
              )
          )

          if janela.get(
              "aplicavel"
          ):

              print(
                  "Início:",
                  janela.get(
                      "inicio_janela_manaus"
                  )
              )

              print(
                  "Mediana:",
                  janela.get(
                      "mediana_manaus"
                  )
              )

              print(
                  "Fim:",
                  janela.get(
                      "fim_janela_manaus"
                  )
              )

          print()

          print(
              "Motivos:"
          )

          for motivo in (
              alerta.get(
                  "motivos"
              )
              or []
          ):
              print(
                  "-",
                  motivo
              )

          print()

          print(
              "Últimas amostras de Serrinha:"
          )

          for sample in (
              alerta.get(
                  "ultimas_amostras_serrinha"
              )
              or []
          ):

              print(
                  sample.get(
                      "hora_manaus"
                  ),
                  "|",
                  sample.get(
                      "variacao_24h_cm"
                  ),
                  "cm/24h"
              )
          PY


      - name: Descartar alteracao do historico nesta execucao
        run: |
          git restore data/history/hourly.csv || true


      - name: Salvar dados em tempo real e alerta
        run: |
          git config user.name "rio-negro-bot"
          git config user.email "actions@github.com"

          git add data/latest.json
          git add data/series_30d.json
          git add data/estacoes.json
          git add data/alerta.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Atualiza dados ANA e alerta"

          git pull --rebase origin main

          git push origin main
