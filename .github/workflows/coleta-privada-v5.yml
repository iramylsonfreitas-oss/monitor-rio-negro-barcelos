name: Coleta privada V5 em sombra

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/coleta-privada-v5.yml"
  schedule:
    - cron: "22,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: coleta-privada-v5
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Verificar disponibilidade da rota de coleta
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://monitor-rio-negro-v5.vercel.app/api/collector"
          try:
              with urllib.request.urlopen(url, timeout=25) as response:
                  raise SystemExit("Falha: coletor aceitou acesso sem autenticação.")
          except urllib.error.HTTPError as exc:
              try:
                  body = json.loads(exc.read().decode("utf-8"))
              except Exception:
                  body = {}
              if exc.code != 401 or body.get("error") != "unauthorized":
                  raise SystemExit(
                      f"Coletor indisponível ou protegido incorretamente: HTTP {exc.code}"
                  )
          print("Rota de coleta disponível e autenticação obrigatória.")
          PY

      - name: Disparar coletor privado
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
          COLLECTOR_URL: https://monitor-rio-negro-v5.vercel.app/api/collector
          OIDC_AUDIENCE: monitor-rio-negro-private-collector
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          audience = os.environ["OIDC_AUDIENCE"]
          oidc_url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience="
              + urllib.parse.quote(audience, safe="")
          )

          oidc_req = urllib.request.Request(
              oidc_url,
              headers={
                  "Authorization":
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(oidc_req, timeout=20) as response:
              oidc_token = json.load(response)["value"]

          payload = json.dumps(
              {
                  "ana_identifier": os.environ["ANA_IDENTIFIER"],
                  "ana_password": os.environ["ANA_PASSWORD"],
              }
          ).encode("utf-8")

          req = urllib.request.Request(
              os.environ["COLLECTOR_URL"],
              data=payload,
              method="POST",
              headers={
                  "Authorization": "Bearer " + oidc_token,
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Private-V5",
              },
          )

          import time
          
          for attempt in range(1, 4):
              print(f"Tentativa de coleta {attempt}/3")
              try:
                  with urllib.request.urlopen(req, timeout=70) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      result = json.loads(body)
                  except Exception:
                      result = {"ok": False, "error": "http_error", "status": exc.code}
              except (urllib.error.URLError, TimeoutError) as exc:
                  result = {"ok": False, "error": "collector_network_error", "type": type(exc).__name__}
          
              safe = {
                  "attempt": attempt,
                  "ok": result.get("ok"),
                  "error": result.get("error"),
                  "type": result.get("type"),
                  "collection_status": result.get("collection_status"),
                  "fallback": result.get("fallback"),
                  "quality": result.get("quality"),
                  "v4_authorized": result.get("v4_authorized"),
                  "shadow_state": result.get("shadow_state"),
                  "uploaded_files": result.get("uploaded_files"),
                  "history_rows_upserted": result.get("history_rows_upserted"),
              }
              print(json.dumps(safe, ensure_ascii=False))
          
              healthy = (
                  result.get("ok") is True
                  and result.get("collection_status") == "ATUALIZADO"
                  and not result.get("fallback")
                  and result.get("quality") == "ATUAL"
                  and result.get("v4_authorized") is True
              )
              if healthy:
                  break
          
              retryable = (
                  result.get("collection_status") == "FONTE_INDISPONIVEL"
                  or result.get("error") == "collector_network_error"
                  or result.get("error") == "private_collector_failed"
                  or result.get("status") in (429, 502, 503, 504)
              )
              if not retryable or attempt == 3:
                  raise SystemExit("Coleta sem dados novos válidos; causa registrada nos logs.")
              wait_seconds = 15 * attempt
              print(f"Falha transitória. Nova tentativa em {wait_seconds}s.")
              time.sleep(wait_seconds)
          PY

      - name: Verificar atualização persistida
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://monitor-rio-negro-v5.vercel.app/api/health"
          req = urllib.request.Request(
              url,
              headers={"Cache-Control": "no-cache", "User-Agent": "RioNegro-Collector-Health"},
          )
          try:
              with urllib.request.urlopen(req, timeout=35) as response:
                  result = json.load(response)
                  status = response.status
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Saúde da coleta falhou: HTTP {exc.code}")
          if status != 200 or result.get("ok") is not True:
              raise SystemExit("Saúde da coleta não confirmou dados atualizados.")
          print(
              json.dumps(
                  {"ok": True, "age_min": result.get("age_min"),
                   "collection_status": result.get("collection_status")},
                  ensure_ascii=False,
              )
          )
          PY
