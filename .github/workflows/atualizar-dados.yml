name: Atualizar dados do Rio Negro

on:
  workflow_dispatch:

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-rio-negro
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar V4.1 operacional em sombra
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
        run: |
          python collector/v41_operacional.py

      - name: Validar V4.1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("data/status_coleta.json"),
              Path("data/qualidade_dados.json"),
              Path("data/convergencia_v4_sombra.json"),
              Path("data/convergencia_v4_detalhes_sombra.json"),
              Path("data/history/alertas_v4.csv"),
              Path("data/latest.json"),
              Path("data/series_30d.json"),
              Path("data/estacoes.json"),
              Path("data/alerta.json"),
              Path("data/repiquete.json"),
          ]

          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(
                  "ERRO: arquivos obrigatorios ausentes: "
                  + ", ".join(missing)
              )

          status = json.loads(
              Path("data/status_coleta.json").read_text(encoding="utf-8")
          )
          qualidade = json.loads(
              Path("data/qualidade_dados.json").read_text(encoding="utf-8")
          )
          sombra = json.loads(
              Path("data/convergencia_v4_sombra.json").read_text(encoding="utf-8")
          )

          coleta = status.get("status")
          qualidade_status = qualidade.get("status")
          autorizada = qualidade.get("v4_autorizada")
          estado = sombra.get("estado")

          valid_collection = {
              "ATUALIZADO",
              "FONTE_INDISPONIVEL",
          }
          if coleta not in valid_collection:
              raise SystemExit(
                  f"ERRO: estado inesperado da coleta: {coleta}"
              )

          if coleta == "ATUALIZADO":
              if qualidade_status != "ATUAL" or autorizada is not True:
                  raise SystemExit(
                      "ERRO: coleta atualizada sem qualidade ATUAL/V4 autorizada."
                  )

          if coleta == "FONTE_INDISPONIVEL":
              if qualidade_status != "FONTE_INDISPONIVEL":
                  raise SystemExit(
                      "ERRO: fallback sem qualidade FONTE_INDISPONIVEL."
                  )
              if autorizada is not False:
                  raise SystemExit(
                      "ERRO: V4 nao pode ficar autorizada durante fallback."
                  )
              if estado != "dados_indisponiveis":
                  raise SystemExit(
                      "ERRO: sombra deveria sinalizar dados_indisponiveis."
                  )

          if sombra.get("publicado_no_painel") is not False:
              raise SystemExit(
                  "ERRO: V4.1 deixou de estar em modo sombra."
              )

          print("======================================")
          print("V4.1 OPERACIONAL")
          print("======================================")
          print("Coleta:", coleta)
          print("Qualidade:", qualidade_status)
          print("V4 autorizada:", autorizada)
          print("Estado sombra:", estado)
          print("Estado hidrologico:", sombra.get("estado_hidrologico"))
          print("Publicado no painel:", sombra.get("publicado_no_painel"))
          print("Fallback:", status.get("fallback_ultima_leitura_valida"))
          PY

      - name: Conferir dados atuais
        run: |
          echo "======================================"
          echo "MONITOR RIO NEGRO"
          echo "======================================"

          python - <<'PY'
          import json

          with open("data/estacoes.json", encoding="utf-8") as f:
              data = json.load(f)

          for station in data.get("estacoes", []):
              print()
              print(station["nome"], station["estacao"])
              print("Nivel:", station["nivel_m"], "m")
              print("6 h:", station["variacao_6h_cm"], "cm")
              print("24 h:", station["variacao_24h_cm"], "cm")
              print("72 h:", station["variacao_72h_cm"], "cm")
              print("7 dias:", station["variacao_7d_cm"], "cm")
              print("Tendencia:", station["tendencia"])
              print("Medicao:", station.get("data_medicao_manaus"))
          PY

      - name: Conferir alerta publico atual
        run: |
          python - <<'PY'
          import json

          with open("data/alerta.json", encoding="utf-8") as f:
              alerta = json.load(f)

          print("======================================")
          print("ALERTA PUBLICO ATUAL")
          print("======================================")
          print("Status:", alerta.get("rotulo"))
          print("Nivel:", alerta.get("nivel"))
          print("Titulo:", alerta.get("titulo"))
          print("Mensagem:", alerta.get("mensagem"))
          PY

      - name: Conferir detector de repiquete
        run: |
          python - <<'PY'
          import json

          with open("data/repiquete.json", encoding="utf-8") as f:
              data = json.load(f)

          print("======================================")
          print("DETECTOR DE REPIQUETE")
          print("======================================")
          print("Nivel:", data.get("nivel"))
          print("Status:", data.get("rotulo"))
          print("Titulo:", data.get("titulo"))
          print("Mensagem:", data.get("mensagem"))
          PY

      - name: Conferir V4.1 em sombra
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          sombra = json.loads(
              Path("data/convergencia_v4_sombra.json").read_text(
                  encoding="utf-8"
              )
          )

          print("======================================")
          print("V4.1 EM SOMBRA")
          print("======================================")
          print("Estado:", sombra.get("estado"))
          print("Estado hidrologico:", sombra.get("estado_hidrologico"))
          print("Mensagem:", sombra.get("mensagem"))
          print("Janela:", sombra.get("janela_previsao_barcelos"))
          print("Publicado no painel:", sombra.get("publicado_no_painel"))

          history = Path("data/history/alertas_v4.csv")
          with history.open("r", encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))

          print("Registros historicos V4.1:", len(rows))
          if rows:
              print("Ultimo registro:", rows[-1])
          PY

      - name: Descartar alteracao do historico hidrologico nesta execucao
        run: |
          git restore data/history/hourly.csv || true

      - name: Salvar dados em tempo real e V4.1 sombra
        run: |
          git config user.name "rio-negro-bot"
          git config user.email "actions@github.com"

          git add data/latest.json
          git add data/series_30d.json
          git add data/estacoes.json
          git add data/alerta.json
          git add data/repiquete.json

          git add data/status_coleta.json
          git add data/qualidade_dados.json
          git add data/convergencia_v4_sombra.json
          git add data/convergencia_v4_detalhes_sombra.json
          git add data/history/alertas_v4.csv

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
            exit 0
          fi

          git commit -m "Atualiza dados e V4.1 em sombra"

          git pull --rebase origin main

          git push origin main
