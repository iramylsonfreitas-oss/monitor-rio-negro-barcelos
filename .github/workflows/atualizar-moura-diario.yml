name: Atualizar Historico Moura - Manual

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-rio-negro
  cancel-in-progress: false

jobs:
  atualizar-moura:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar historico de Moura
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
        run: |
          python collector/moura_historico.py

      - name: Conferir Moura no historico
        run: |
          python - <<'PY'
          import csv

          arquivo = "data/history/hourly.csv"

          with open(arquivo, "r", encoding="utf-8", newline="") as f:
              rows = [
                  row
                  for row in csv.DictReader(f)
                  if row.get("estacao") == "14840000"
              ]

          if not rows:
              raise RuntimeError("Nenhum registro de Moura encontrado.")

          rows.sort(key=lambda row: row["hora_manaus"])

          print("Registros horarios de Moura:", len(rows))
          print("Primeiro registro:", rows[0]["hora_manaus"])
          print("Ultimo registro:", rows[-1]["hora_manaus"])
          print("Ultimo nivel:", rows[-1]["nivel_m"], "m")
          PY

      - name: Salvar historico de Moura
        run: |
          git config user.name "rio-negro-bot"
          git config user.email "actions@github.com"

          git add data/history/hourly.csv

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
            exit 0
          fi

          git commit -m "Atualiza historico manual de Moura"
          git pull --rebase origin main
          git push origin main
