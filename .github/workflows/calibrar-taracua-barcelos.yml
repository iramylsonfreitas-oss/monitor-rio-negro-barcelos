name: Calibrar Taracua Barcelos Multiescala

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrar-taracua-barcelos:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calibrar Taracua para Barcelos
        run: |
          python collector/calibrar_taracua_barcelos.py

      - name: Salvar resultados
        uses: actions/upload-artifact@v4
        with:
          name: taracua-barcelos-calibracao
          path: |
            artifacts/taracua_barcelos_robustos.csv
            artifacts/taracua_barcelos_rejeitados.csv
            artifacts/taracua_barcelos_escalas.csv
            artifacts/resumo_taracua_barcelos.json
          retention-days: 14
