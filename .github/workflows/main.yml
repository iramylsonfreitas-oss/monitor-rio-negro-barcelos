name: Diagnostico ANA Barcelos

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnosticar API ANA
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
        run: |
          set -e

          echo "======================================"
          echo "1. AUTENTICAÇÃO"
          echo "======================================"

          curl -sS \
            -H "Identificador: $ANA_IDENTIFIER" \
            -H "Senha: $ANA_PASSWORD" \
            "https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/OAUth/v1" \
            -o auth.json

          TOKEN=$(python - <<'PY'
          import json

          with open("auth.json", encoding="utf-8") as f:
              data = json.load(f)

          token = (data.get("items") or {}).get("tokenautenticacao")

          if not token:
              raise SystemExit("ERRO: token não encontrado")

          print(token)
          PY
          )

          echo "Autenticação OK."
          echo

          BASE="https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/HidroinfoanaSerieTelemetricaAdotada/v1"

          testar () {
            NOME="$1"
            URL="$2"

            echo "======================================"
            echo "$NOME"
            echo "======================================"

            HTTP=$(curl -sS \
              -o resposta.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/json" \
              "$URL")

            echo "HTTP: $HTTP"

            python - <<'PY'
          import json

          try:
              with open("resposta.json", encoding="utf-8") as f:
                  data = json.load(f)

              print("Tipo da resposta:", type(data).__name__)

              if isinstance(data, dict):
                  print("Campos principais:", list(data.keys()))

                  if "message" in data:
                      print("Mensagem:", data["message"])

                  items = data.get("items")

                  if isinstance(items, list):
                      print("Quantidade de registros:", len(items))

                      if items:
                          print("Primeiro registro:", items[0])

                  elif isinstance(items, dict):
                      print("Campos de items:", list(items.keys()))

              print()

          except Exception as e:
              print("Resposta não interpretada como JSON.")
              print("Erro:", e)
              print()
          PY
          }

          testar \
            "TESTE A - DIAS_30" \
            "$BASE?CodigoDaEstacao=14480002&TipoFiltroData=DATA_LEITURA&RangeIntervaloDeBusca=DIAS_30"

          testar \
            "TESTE B - DIAS_2" \
            "$BASE?CodigoDaEstacao=14480002&TipoFiltroData=DATA_LEITURA&RangeIntervaloDeBusca=DIAS_2"

          testar \
            "TESTE C - HORA_24" \
            "$BASE?CodigoDaEstacao=14480002&TipoFiltroData=DATA_LEITURA&RangeIntervaloDeBusca=HORA_24"

          testar \
            "TESTE D - somente estação" \
            "$BASE?CodigoDaEstacao=14480002"

          echo "======================================"
          echo "DIAGNÓSTICO CONCLUÍDO"
          echo "======================================"
