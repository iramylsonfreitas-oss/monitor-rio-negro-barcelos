name: Descobrir Swagger ANA

on:
  workflow_dispatch:

jobs:
  descobrir:
    runs-on: ubuntu-latest

    steps:
      - name: Inspecionar pagina oficial Swagger ANA
        run: |
          python - <<'PY'
          import urllib.request
          import re

          URL = "https://www.ana.gov.br/hidrowebservice/swagger-ui.html"

          print("Consultando página oficial:")
          print(URL)
          print()

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  html = r.read().decode("utf-8", errors="replace")
                  print("HTTP:", r.status)
                  print("Tamanho da página:", len(html), "caracteres")
          except Exception as e:
              print("ERRO ao abrir swagger-ui.html:", e)
              raise SystemExit(1)

          print()
          print("======================================")
          print("REFERÊNCIAS ENCONTRADAS NA PÁGINA")
          print("======================================")

          padroes = [
              r'[^"\']*api-docs[^"\']*',
              r'[^"\']*swagger-resources[^"\']*',
              r'[^"\']*swagger[^"\']*\.json[^"\']*',
              r'[^"\']*configuration[^"\']*',
              r'url\s*:\s*["\']([^"\']+)["\']',
              r'urls\s*:\s*(\[[^\]]+\])'
          ]

          encontrados = set()

          for padrao in padroes:
              for item in re.findall(padrao, html, flags=re.I):
                  if isinstance(item, tuple):
                      item = " ".join(item)
                  item = str(item).strip()

                  if item and item not in encontrados:
                      encontrados.add(item)
                      print(item)

          print()
          print("======================================")
          print("SCRIPTS CARREGADOS")
          print("======================================")

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          for src in scripts:
              print(src)

          print()
          print("======================================")

          if encontrados:
              print("SUCESSO: referências da configuração foram encontradas.")
          else:
              print("Nenhuma referência direta encontrada no HTML.")
              print("Os scripts listados acima serão o próximo ponto de análise.")

          print("======================================")
          PY
