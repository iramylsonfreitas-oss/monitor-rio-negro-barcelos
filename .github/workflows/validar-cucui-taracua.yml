name: Validar Cucui Taracua Multiescala

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-cucui-taracua:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar Cucui para Taracua
        run: |
          python collector/validar_cucui_taracua.py

      - name: Salvar resultados
        uses: actions/upload-artifact@v4
        with:
          name: cucui-taracua-validacao
          path: |
            artifacts/cucui_taracua_robustos.csv
            artifacts/cucui_taracua_rejeitados.csv
            artifacts/cucui_taracua_escalas.csv
            artifacts/resumo_cucui_taracua.json
          retention-days: 14
