name: Teste ANA Barcelos

on:
  workflow_dispatch:

jobs:
  testar-barcelos:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar estação 14480002
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
        run: |
          set -e

          echo "1. Autenticando na ANA..."

          AUTH_HTTP=$(curl -sS -o auth.json -w "%{http_code}" \
            -H "Identificador: $ANA_IDENTIFIER" \
            -H "Senha: $ANA_PASSWORD" \
            "https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/OAUth/v1")

          echo "HTTP autenticação: $AUTH_HTTP"

          if [ "$AUTH_HTTP" != "200" ]; then
            echo "ERRO na autenticação."
            exit 1
          fi

          TOKEN=$(python - <<'PY'
          import json

          with open("auth.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("items") or {}
          token = items.get("tokenautenticacao")

          if not token:
              raise SystemExit("Token não encontrado.")

          print(token)
          PY
          )

          echo "Token obtido com sucesso."
          echo "2. Consultando estação 14480002 - Barcelos..."

          HTTP_CODE=$(curl -sS -o telemetria.json -w "%{http_code}" \
            --get \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json" \
            --data-urlencode "CodigoDaEstacao=14480002" \
            --data-urlencode "TipoFiltroData=DATA_LEITURA" \
            --data-urlencode "RangeIntervaloDeBusca=DIAS_30" \
            "https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/HidroinfoanaSerieTelemetricaAdotada/v1")

          echo "HTTP telemetria: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "A consulta da estação não retornou HTTP 200."
            echo "Resposta da ANA:"
            head -c 2000 telemetria.json
            echo
            exit 1
          fi

          python - <<'PY'
          import json

          with open("telemetria.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Resposta recebida da ANA.")

          items = data.get("items")

          registros = []

          def procurar(obj):
              if isinstance(obj, dict):
                  if (
                      "Data_Hora_Medicao" in obj
                      or "Cota_Adotada" in obj
                      or "codigoestacao" in obj
                  ):
                      registros.append(obj)

                  for valor in obj.values():
                      procurar(valor)

              elif isinstance(obj, list):
                  for valor in obj:
                      procurar(valor)

          procurar(items)

          if not registros:
              print("ERRO: a ANA respondeu, mas nenhum registro de telemetria foi localizado.")
              print("Campos principais:", list(data.keys()))
              raise SystemExit(1)

          registros_validos = [
              r for r in registros
              if r.get("Data_Hora_Medicao") and r.get("Cota_Adotada") not in (None, "")
          ]

          if not registros_validos:
              print("ERRO: registros encontrados, mas nenhum contém data e cota válidas.")
              raise SystemExit(1)

          ultimo = max(
              registros_validos,
              key=lambda r: str(r.get("Data_Hora_Medicao", ""))
          )

          cota = ultimo.get("Cota_Adotada")

          print("--------------------------------")
          print("ESTAÇÃO:", ultimo.get("codigoestacao", "14480002"))
          print("DATA/HORA:", ultimo.get("Data_Hora_Medicao"))
          print("COTA ANA:", cota, "cm")

          try:
              print("NÍVEL:", round(float(str(cota).replace(",", ".")) / 100, 2), "m")
          except:
              pass

          print("STATUS DA COTA:", ultimo.get("Cota_Adotada_Status"))
          print("ATUALIZAÇÃO:", ultimo.get("Data_Atualizacao"))
          print("--------------------------------")
          print("SUCESSO: Barcelos foi consultada.")
          PY
