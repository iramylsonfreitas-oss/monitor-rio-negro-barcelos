name: Validar Barcelos Moura por Regime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-barcelos-moura:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar defasagem por regime
        run: |
          python collector/validar_barcelos_moura_regimes.py
