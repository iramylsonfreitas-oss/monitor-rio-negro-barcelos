name: Testar Estacoes Montante

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar estacoes do Rio Negro
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}

        run: |
          python - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime

          IDENTIFICADOR = os.environ["ANA_IDENTIFIER"]
          SENHA = os.environ["ANA_PASSWORD"]

          ESTACOES = {
              "14110000": "Cucuí",
              "14280001": "Taracuá",
              "14330000": "Curicuriari",
              "14420000": "Serrinha",
              "14480002": "Barcelos"
          }

          AUTH_URL = (
              "https://www.ana.gov.br/hidrowebservice/"
              "EstacoesTelemetricas/OAUth/v1"
          )

          DATA_URL = (
              "https://www.ana.gov.br/hidrowebservice/"
              "EstacoesTelemetricas/"
              "HidroinfoanaSerieTelemetricaAdotada/v2"
          )


          def autenticar():
              req = urllib.request.Request(
                  AUTH_URL,
                  headers={
                      "Identificador": IDENTIFICADOR,
                      "Senha": SENHA,
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=40
              ) as response:

                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              token = (
                  data.get("items") or {}
              ).get("tokenautenticacao")

              if not token:
                  raise RuntimeError(
                      "Token não encontrado."
                  )

              return token


          def consultar(token, codigos):
              query = urllib.parse.urlencode(
                  {
                      "Codigos_Estacoes":
                          ",".join(codigos),

                      "Tipo Filtro Data":
                          "DATA_LEITURA",

                      "Range Intervalo de busca":
                          "DIAS_30"
                  }
              )

              url = DATA_URL + "?" + query

              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization":
                          "Bearer " + token,

                      "Accept":
                          "application/json",

                      "User-Agent":
                          "Monitor-Rio-Negro/1.0"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=120
              ) as response:

                  data = json.loads(
                      response.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

                  return data.get("items") or []


          def parse_data(value):
              return datetime.fromisoformat(
                  value.replace(" ", "T")
              )


          print("======================================")
          print("AUTENTICANDO")
          print("======================================")

          token = autenticar()

          print("Autenticação OK.")
          print()

          registros = []

          print("======================================")
          print("CONSULTA MULTIESTACAO")
          print("======================================")

          try:
              registros = consultar(
                  token,
                  list(ESTACOES.keys())
              )

              print(
                  "Consulta conjunta funcionou."
              )

              print(
                  "Total de registros:",
                  len(registros)
              )

          except Exception as erro:

              print(
                  "Consulta conjunta falhou:"
              )

              print(erro)

              print()
              print(
                  "Usando fallback individual..."
              )

              for codigo, nome in ESTACOES.items():

                  print()
                  print(
                      f"Consultando {nome} "
                      f"({codigo})..."
                  )

                  sucesso = False

                  for tentativa in range(1, 4):

                      try:
                          itens = consultar(
                              token,
                              [codigo]
                          )

                          registros.extend(
                              itens
                          )

                          print(
                              "Registros:",
                              len(itens)
                          )

                          sucesso = True
                          break

                      except Exception as e:

                          print(
                              f"Tentativa "
                              f"{tentativa} falhou:",
                              e
                          )

                          time.sleep(
                              5 * tentativa
                          )

                  if not sucesso:
                      print(
                          "ERRO: estação sem retorno."
                      )


          print()
          print("======================================")
          print("RESULTADO POR ESTACAO")
          print("======================================")

          for codigo, nome in ESTACOES.items():

              dados = [
                  row
                  for row in registros

                  if str(
                      row.get("codigoestacao")
                  ) == codigo

                  and row.get(
                      "Data_Hora_Medicao"
                  )

                  and row.get(
                      "Cota_Adotada"
                  ) not in (
                      None,
                      ""
                  )
              ]

              print()
              print("--------------------------------------")
              print(nome)
              print("Código:", codigo)
              print("Registros válidos:", len(dados))

              if not dados:
                  print(
                      "SEM DADOS VÁLIDOS"
                  )
                  continue

              ultimo = max(
                  dados,
                  key=lambda row:
                      parse_data(
                          row[
                              "Data_Hora_Medicao"
                          ]
                      )
              )

              nivel_cm = float(
                  str(
                      ultimo[
                          "Cota_Adotada"
                      ]
                  ).replace(
                      ",",
                      "."
                  )
              )

              print(
                  "Última medição:",
                  ultimo[
                      "Data_Hora_Medicao"
                  ]
              )

              print(
                  "Nível:",
                  round(
                      nivel_cm / 100,
                      2
                  ),
                  "m"
              )

              print(
                  "Atualização ANA:",
                  ultimo.get(
                      "Data_Atualizacao"
                  )
              )


          print()
          print("======================================")
          print("FIM")
          print("======================================")
          PY
