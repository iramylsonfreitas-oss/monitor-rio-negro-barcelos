name: Testar Motor Convergencia Espacial V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-convergencia-v2:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar motor de convergencia V2
        run: python collector/convergencia_espacial_v2.py

      - name: Salvar resultados
        uses: actions/upload-artifact@v4
        with:
          name: convergencia-espacial-v2
          path: |
            artifacts/convergencia_v2.json
            artifacts/convergencia_v2_detalhes.csv
            artifacts/convergencia_v2_cadeias.csv
          retention-days: 14
