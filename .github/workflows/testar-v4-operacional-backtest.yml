name: Testar V4 Operacional + Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-v4:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar estado atual V4
        run: python collector/convergencia_espacial_v4.py

      - name: Executar backtest V4
        run: python collector/backtest_convergencia_v4.py

      - name: Salvar resultados
        uses: actions/upload-artifact@v4
        with:
          name: v4-operacional-backtest
          path: |
            artifacts/convergencia_v4.json
            artifacts/convergencia_v4_detalhes.json
            artifacts/backtest_v4_alertas.csv
            artifacts/backtest_v4_metricas.csv
            artifacts/backtest_v4_metricas_anuais.csv
            artifacts/backtest_v4_resumo.json
          retention-days: 14
