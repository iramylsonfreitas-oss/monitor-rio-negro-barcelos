name: Atualizar dados do Rio Negro

on:
  workflow_dispatch:

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-rio-negro
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Consultar ANA
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
        run: |
          python collector/ana.py


      - name: Conferir dados atuais
        run: |
          echo "======================================"
          echo "MONITOR RIO NEGRO"
          echo "======================================"

          python - <<'PY'
          import json

          with open(
              "data/estacoes.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          for station in data.get(
              "estacoes",
              []
          ):

              print()
              print(
                  station["nome"],
                  station["estacao"]
              )

              print(
                  "Nível:",
                  station["nivel_m"],
                  "m"
              )

              print(
                  "6 h:",
                  station[
                      "variacao_6h_cm"
                  ],
                  "cm"
              )

              print(
                  "24 h:",
                  station[
                      "variacao_24h_cm"
                  ],
                  "cm"
              )

              print(
                  "72 h:",
                  station[
                      "variacao_72h_cm"
                  ],
                  "cm"
              )

              print(
                  "7 dias:",
                  station[
                      "variacao_7d_cm"
                  ],
                  "cm"
              )

              print(
                  "Tendência:",
                  station[
                      "tendencia"
                  ]
              )

              print(
                  "Medição:",
                  station.get(
                      "data_medicao_manaus"
                  )
              )
          PY


      - name: Descartar alteracao do historico nesta execucao
        run: |
          git restore data/history/hourly.csv || true


      - name: Salvar somente dados em tempo real
        run: |
          git config user.name "rio-negro-bot"
          git config user.email "actions@github.com"

          git add data/latest.json
          git add data/series_30d.json
          git add data/estacoes.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Atualiza dados atuais ANA"

          git pull --rebase origin main

          git push origin main
