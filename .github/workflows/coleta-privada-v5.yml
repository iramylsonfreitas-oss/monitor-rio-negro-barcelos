name: Coleta privada V5 em sombra

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/coleta-privada-v5.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: coleta-privada-v5
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Verificar disponibilidade da rota de coleta
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://monitor-rio-negro-v5.vercel.app/api/collector"
          try:
              with urllib.request.urlopen(url, timeout=25) as response:
                  raise SystemExit("Falha: coletor aceitou acesso sem autenticação.")
          except urllib.error.HTTPError as exc:
              try:
                  body = json.loads(exc.read().decode("utf-8"))
              except Exception:
                  body = {}
              if exc.code != 401 or body.get("error") != "unauthorized":
                  raise SystemExit(
                      f"Coletor indisponível ou protegido incorretamente: HTTP {exc.code}"
                  )
          print("Rota de coleta disponível e autenticação obrigatória.")
          PY

      - name: Disparar coletor privado
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
          COLLECTOR_URL: https://monitor-rio-negro-v5.vercel.app/api/collector
          OIDC_AUDIENCE: monitor-rio-negro-private-collector
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          audience = os.environ["OIDC_AUDIENCE"]
          oidc_url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience="
              + urllib.parse.quote(audience, safe="")
          )

          oidc_req = urllib.request.Request(
              oidc_url,
              headers={
                  "Authorization":
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(oidc_req, timeout=20) as response:
              oidc_token = json.load(response)["value"]

          payload = json.dumps(
              {
                  "ana_identifier": os.environ["ANA_IDENTIFIER"],
                  "ana_password": os.environ["ANA_PASSWORD"],
              }
          ).encode("utf-8")

          req = urllib.request.Request(
              os.environ["COLLECTOR_URL"],
              data=payload,
              method="POST",
              headers={
                  "Authorization": "Bearer " + oidc_token,
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Private-V5",
              },
          )

          import time
          
          for attempt in range(1, 4):
              print(f"Tentativa de coleta {attempt}/3")
              try:
                  with urllib.request.urlopen(req, timeout=70) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      result = json.loads(body)
                  except Exception:
                      result = {"ok": False, "error": "http_error", "status": exc.code}
              except (urllib.error.URLError, TimeoutError) as exc:
                  result = {"ok": False, "error": "collector_network_error", "type": type(exc).__name__}
          
              safe = {
                  "attempt": attempt,
                  "ok": result.get("ok"),
                  "error": result.get("error"),
                  "type": result.get("type"),
                  "collection_status": result.get("collection_status"),
                  "fallback": result.get("fallback"),
                  "quality": result.get("quality"),
                  "v4_authorized": result.get("v4_authorized"),
                  "shadow_state": result.get("shadow_state"),
                  "uploaded_files": result.get("uploaded_files"),
                  "history_rows_upserted": result.get("history_rows_upserted"),
              }
              print(json.dumps(safe, ensure_ascii=False))
          
              healthy = (
                  result.get("ok") is True
                  and result.get("collection_status") == "ATUALIZADO"
                  and not result.get("fallback")
                  and result.get("quality") == "ATUAL"
                  and result.get("v4_authorized") is True
              )
              if healthy:
                  break
          
              retryable = (
                  result.get("collection_status") == "FONTE_INDISPONIVEL"
                  or result.get("error") == "collector_network_error"
                  or result.get("error") == "private_collector_failed"
                  or result.get("status") in (429, 502, 503, 504)
              )
              if not retryable or attempt == 3:
                  raise SystemExit("Coleta sem dados novos válidos; causa registrada nos logs.")
              wait_seconds = 15 * attempt
              print(f"Falha transitória. Nova tentativa em {wait_seconds}s.")
              time.sleep(wait_seconds)
          PY

      - name: Verificar atualização persistida
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://monitor-rio-negro-v5.vercel.app/api/health"
          req = urllib.request.Request(
              url,
              headers={"Cache-Control": "no-cache", "User-Agent": "RioNegro-Collector-Health"},
          )
          try:
              with urllib.request.urlopen(req, timeout=35) as response:
                  result = json.load(response)
                  status = response.status
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Saúde da coleta falhou: HTTP {exc.code}")
          if status != 200 or result.get("ok") is not True:
              raise SystemExit("Saúde da coleta não confirmou dados atualizados.")
          print(
              json.dumps(
                  {"ok": True, "age_min": result.get("age_min"),
                   "collection_status": result.get("collection_status")},
                  ensure_ascii=False,
              )
          )
          PY


  auditar_lacuna:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[auditar-lacuna-20261118]')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Conferir lacuna de Barcelos nas rotas oficiais da ANA
        env:
          ANA_IDENTIFIER: ${{ secrets.ANA_IDENTIFIER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import statistics
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo
          
          BASE = "https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/"
          LOCAL = ZoneInfo("America/Manaus")
          ANA_ZONE = ZoneInfo("America/Sao_Paulo")
          START = datetime(2026, 11, 10, 7, tzinfo=LOCAL)
          END = datetime(2026, 11, 17, 9, tzinfo=LOCAL)
          STATION = "14480002"
          
          def read(url, headers, timeout=45):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"HTTP_{error.code}") from None
          
          def stamp(value):
              result = datetime.fromisoformat(str(value).replace(" ", "T").replace("Z", "+00:00"))
              if result.tzinfo is None:
                  result = result.replace(tzinfo=ANA_ZONE)
              return result.astimezone(LOCAL)
          
          def summarize(items):
              revisions = {}
              for row in items:
                  if not isinstance(row, dict) or str(row.get("codigoestacao")) != STATION:
                      continue
                  try:
                      measured = stamp(row.get("Data_Hora_Medicao"))
                      value = float(str(row.get("Cota_Adotada")).replace(",", "."))
                      if not math.isfinite(value) or measured > datetime.now(timezone.utc):
                          continue
                      if str(row.get("Cota_Adotada_Status", "")) != "0":
                          continue
                      try:
                          revision = stamp(row.get("Data_Atualizacao"))
                      except (TypeError, ValueError, OverflowError):
                          revision = datetime.min.replace(tzinfo=timezone.utc)
                  except (TypeError, ValueError, OverflowError):
                      continue
                  previous = revisions.get(measured)
                  if previous is None or revision > previous[0]:
                      revisions[measured] = (revision, value)
                  elif revision == previous[0] and value != previous[1]:
                      raise ValueError("conflicting_revision")
              groups = {}
              for measured, (_, value) in revisions.items():
                  if START <= measured < END:
                      hour = measured.replace(minute=0, second=0, microsecond=0)
                      groups.setdefault(hour, []).append((measured, value))
              hours = []
              for hour, points in sorted(groups.items()):
                  values = [value for _, value in points]
                  hours.append({
                      "hour": hour.strftime("%Y-%m-%d %H:00:00"),
                      "level_cm": statistics.median(values),
                      "min_cm": min(values),
                      "max_cm": max(values),
                      "measurements": len(points),
                      "last": max(measured for measured, _ in points).strftime("%Y-%m-%d %H:%M:%S"),
                  })
              times = sorted(revisions)
              return {
                  "valid_observations": len(revisions),
                  "first": times[0].isoformat() if times else None,
                  "last": times[-1].isoformat() if times else None,
                  "window_bracketed": bool(times and times[0] < START and times[-1] >= END),
                  "recovered_hours": len(hours),
                  "hourly_rows": hours,
              }
          
          def main():
              if not os.environ.get("ANA_IDENTIFIER") or not os.environ.get("ANA_PASSWORD"):
                  print("ANA_GAP_AUDIT_ERROR=credentials_missing")
                  return 1
              try:
                  auth = read(BASE + "OAUth/v1", {
                      "Identificador": os.environ["ANA_IDENTIFIER"],
                      "Senha": os.environ["ANA_PASSWORD"],
                      "Accept": "application/json",
                  }, timeout=25)
                  token = (auth.get("items") or {}).get("tokenautenticacao")
                  if not token:
                      raise ValueError("missing_token")
                  headers = {"Accept": "application/json", "Authorization": "Bearer " + token}
              except Exception as error:
                  print("ANA_GAP_AUDIT_ERROR=" + type(error).__name__)
                  return 1
              routes = [
                  ("adopted_v2", "HidroinfoanaSerieTelemetricaAdotada/v2", {
                      "Codigos_Estacoes": STATION,
                      "Tipo Filtro Data": "DATA_LEITURA",
                      "Range Intervalo de busca": "DIAS_30",
                  }),
                  ("adopted_v1", "HidroinfoanaSerieTelemetricaAdotada/v1", {
                      "CodigoDaEstacao": STATION,
                      "TipoFiltroData": "DATA_LEITURA",
                      "RangeIntervaloDeBusca": "DIAS_30",
                  }),
              ]
              results = []
              for name, route, query in routes:
                  try:
                      response = read(BASE + route + "?" + urllib.parse.urlencode(query), headers)
                      items = response.get("items")
                      if not isinstance(items, list):
                          raise ValueError("invalid_items")
                      result = {"route": name, "ok": True, **summarize(items)}
                  except Exception as error:
                      result = {"route": name, "ok": False, "error_type": type(error).__name__}
                      if isinstance(error, RuntimeError) and str(error).startswith("HTTP_"):
                          result["http_error"] = str(error)
                  results.append(result)
                  print("ANA_GAP_ROUTE=" + json.dumps(result, ensure_ascii=False))
              print("ANA_GAP_AUDIT_JSON=" + json.dumps({
                  "station": STATION,
                  "start": START.isoformat(),
                  "end_exclusive": END.isoformat(),
                  "expected_hours": 170,
                  "routes": results,
              }, ensure_ascii=False))
              return 0 if any(result.get("ok") for result in results) else 1
          
          raise SystemExit(main())
          
          PY
